# Base44 sandbox/dev environment for this repo.
#
# The project is a single self-contained HTML export (React + Tailwind inlined,
# no build step, no backend). nginx serves the bind-mounted source directly, so
# edits to the HTML file are visible on refresh without a rebuild.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    labels:
      base44.project: "AstroAlquimia Portfolio"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      # Sandbox-only nginx config (workers as root: the mounted repo root is 0700).
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.base44/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
