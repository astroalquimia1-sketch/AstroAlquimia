# Sandbox-only nginx main config: the repository root is bind-mounted and is
# root-owned 0700, so the workers must run as root *inside this container* to
# read the bind mount. Everything else mirrors nginx's stock alpine config.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
