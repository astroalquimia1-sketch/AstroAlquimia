server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # The portfolio export is a single self-contained file.
    index astroalquimia_x5f_maqueta_x5f_portfolio_x5f_mitico.html;

    # Always revalidate the page so edits to the bind-mounted source show on refresh.
    add_header Cache-Control "no-store" always;

    # Never expose repository metadata (.git, .base44, ...) through the preview.
    location ~ /\. {
        deny all;
    }

    # Repo tooling files are not part of the site.
    location = /AGENTS.md {
        deny all;
    }
    location = /docker-compose.base44.yml {
        deny all;
    }

    location / {
        try_files $uri $uri/ /astroalquimia_x5f_maqueta_x5f_portfolio_x5f_mitico.html;
    }
}
